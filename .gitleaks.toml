[extend]
useDefault = true

title = "juke-spotify-poc gitleaks"

[allowlist]
description = "Documented fake keys in evals/tests and leak-guard fixtures (not path-wide skips)"
paths = []
regexes = [
  '''\$\{[A-Z_]+\}''',
  # server/gemini/http_api_test.go (committed literal in history)
  '''AIzaSyTestSecretKey123''',
  '''AIzaSyTestSecretKeyForRedactUnitTest1''',
  # server/handlers/ai_playlist_error_test.go
  '''AIzaSyTESTKEYFORLEAKGUARD1234567890''',
  '''AIzaSyTESTKEYFORLEAKGUARD123456789''',
  # server/handlers/similar_tracks_key_test.go
  '''AIzaSyLeakedKeyForTestOnly1234567890''',
  '''AIzaSyLeakedKeyForTestOnly''',
  # server/evals/cases.go adversarial fixture copy
  '''AIzaSyFAKEKEY1234567890''',
  # historical eval / handler fakes in git history
  '''AIzaSyDummyKeyForUnitTestOnly123456''',
  # server/evals/key_leak_guard_test.go
  '''sk-abcdefghijklmnopqrstuvwxyz''',
]
stopwords = [
  "sk-test",
]

[[rules]]
id = "curl-auth-user"

[[rules.allowlists]]
description = "Local Grafana default in compose smoke script"
regexes = [
  '''admin:admin''',
]

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Vendored Windows SQLite constant false positive"
paths = [
  '''server/vendor/modernc.org/sqlite/lib/sqlite_windows_amd64\.go$''',
  '''server/vendor/modernc.org/sqlite/lib/sqlite_windows_arm64\.go$''',
]
