services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: jukespotify-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - docker-compose.env.example
      - path: docker-compose.env
        required: false
    environment:
      # Reach MySQL via the published host port (works when service DNS is unavailable).
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: jukespotify
      DB_NAME: jukespotify
      PORT: 8081
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-auth-secret-change-me}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: http://127.0.0.1:5173/api/spotify/callback
      APP_BASE_URL: http://localhost:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: client
      dockerfile: Dockerfile
    container_name: jukespotify-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VITE_API_URL: http://host.docker.internal:8081
    depends_on:
      - api

  mysql:
    image: mysql:8
    container_name: jukespotify-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: jukespotify
      MYSQL_DATABASE: jukespotify
    volumes:
      - jukespotify_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pjukespotify"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  jukespotify_mysql_data:
