# API and edge services reach dependencies via host-published ports (host.docker.internal).
# This keeps the stack working on Docker setups where container-to-container traffic is restricted,
# while still using a single Compose file and internal service names for healthchecks and backups.

x-extra-hosts: &extra-hosts
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-api-environment: &api-environment
  DB_HOST: host.docker.internal
  DB_PORT: 3306
  DB_USER: root
  DB_PASSWORD: jukespotify
  DB_NAME: jukespotify
  PORT: 8081
  REDIS_ADDR: host.docker.internal:6379
  OPENSEARCH_URL: http://host.docker.internal:9200
  KAFKA_BROKERS: host.docker.internal:29092
  METRICS_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: host.docker.internal:4317
  AUTH_SECRET: ${AUTH_SECRET:-local-dev-auth-secret-change-me}
  SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
  SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
  SPOTIFY_REDIRECT_URI: http://127.0.0.1:5173/api/spotify/callback
  APP_BASE_URL: http://localhost:5173
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

services:
  api-1:
    <<: *extra-hosts
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "18081:8081"
    environment:
      <<: *api-environment
      INSTANCE_ID: api-1
    env_file:
      - docker-compose.env.example
      - path: docker-compose.env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  api-2:
    <<: *extra-hosts
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "18082:8081"
    environment:
      <<: *api-environment
      INSTANCE_ID: api-2
    env_file:
      - docker-compose.env.example
      - path: docker-compose.env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  nginx:
    <<: *extra-hosts
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    <<: *extra-hosts
    build:
      context: client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://host.docker.internal:8081
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ | grep -qi '<div id=\"root\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  mysql:
    image: mysql:8
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: jukespotify
      MYSQL_DATABASE: jukespotify
    volumes:
      - jukespotify_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pjukespotify"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql-backup:
    <<: *extra-hosts
    image: mysql:8
    restart: unless-stopped
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: jukespotify
      DB_NAME: jukespotify
      BACKUP_INTERVAL_SEC: ${MYSQL_BACKUP_INTERVAL_SEC:-86400}
    volumes:
      - ./deploy/mysql-backup/backup.sh:/backup.sh:ro
      - jukespotify_mysql_backups:/backups
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        while true; do
          bash /backup.sh
          sleep "$${BACKUP_INTERVAL_SEC}"
        done
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h \"$$DB_HOST\" -P \"$$DB_PORT\" -u \"$$DB_USER\" -p\"$$DB_PASSWORD\" --protocol=TCP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - jukespotify_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://host.docker.internal:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  prometheus:
    <<: *extra-hosts
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - jukespotify_prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - api-1
      - api-2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy | grep -q Healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  grafana:
    <<: *extra-hosts
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - jukespotify_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"database\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  loki:
    image: grafana/loki:2.9.4
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - jukespotify_loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready | grep -q '^ready$'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  promtail:
    <<: *extra-hosts
    image: grafana/promtail:2.9.4
    restart: unless-stopped
    volumes:
      - ./deploy/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.6.0
    restart: unless-stopped
    ports:
      - "3200:3200"
      - "4317:4317"
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./deploy/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - jukespotify_tempo_data:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  jukespotify_mysql_data:
  jukespotify_mysql_backups:
  jukespotify_opensearch_data:
  jukespotify_prometheus_data:
  jukespotify_grafana_data:
  jukespotify_loki_data:
  jukespotify_tempo_data:
