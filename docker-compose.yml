services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: jukespotify-api
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: jukespotify
      DB_NAME: jukespotify
      PORT: 8081
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-auth-secret-change-me}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: http://127.0.0.1:5173/api/spotify/callback
      APP_BASE_URL: http://localhost:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: client
      dockerfile: Dockerfile
    container_name: jukespotify-web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://api:8081
    depends_on:
      - api

  mysql:
    image: mysql:8
    container_name: jukespotify-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: jukespotify
      MYSQL_DATABASE: jukespotify
    volumes:
      - jukespotify_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pjukespotify"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  jukespotify_mysql_data:
