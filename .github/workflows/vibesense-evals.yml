name: VibeSense evals (mocked)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: vibesense-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vibesense-evals-mocked:
    name: VibeSense eval gate (mocked)
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2.11.0
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Mocked eval subset vs baseline
        env:
          OPENSEARCH_URL: http://localhost:9200
        run: |
          go test -short -count=1 ./evals/ -run 'TestVibeSenseEvalGateCI|TestKeyLeakGuard|TestVibeSenseVectorRegressionGate|TestCatalogVectorRetrievalIntegration' -write-reports
          cat evals/out/report.md || true

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibesense-evals-mocked-report
          path: |
            server/evals/out/report.json
            server/evals/out/report.md
