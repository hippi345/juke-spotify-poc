name: VibeSense evals (live)

on:
  pull_request:
    paths:
      - "server/evals/**"
      - "server/gemini/**"
      - "server/handlers/ai_playlist.go"
      - "server/handlers/similar_tracks.go"
      - "server/vector/**"
      - "client/src/components/AiPlaylistPanel.tsx"
      - "scripts/run-live-evals.sh"
      - "scripts/check-artifact-secrets.sh"
      - "Makefile"
      - ".github/workflows/vibesense-evals-live.yml"
  push:
    branches: [main]
    paths:
      - "server/evals/**"
      - "server/gemini/**"
      - "server/handlers/ai_playlist.go"
      - "server/vector/**"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: vibesense-evals-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vibesense-evals-live:
    name: VibeSense eval gate (live)
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2.11.0
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Require GEMINI_API_KEY (no skip on forks or missing secret)
        env:
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FORK" = "true" ]; then
            echo "::error::Fork pull requests cannot run live VibeSense evals. Use a branch on the upstream repository."
            exit 1
          fi
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::error::Repository secret GEMINI_API_KEY is required for live VibeSense evals."
            exit 1
          fi

      - name: Live eval suite (vector OFF and ON, call cap)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JUKE_EVALS_LIVE: "1"
          JUKE_EVALS_LIVE_CALL_CAP: "250"
          JUKE_EVALS_JUDGE_RUNS: "2"
          OPENSEARCH_URL: http://localhost:9200
        run: |
          mkdir -p artifacts/live-evals
          ./scripts/run-live-evals.sh
          ./scripts/check-artifact-secrets.sh
          python3 ./scripts/print-eval-threshold-table.py

      - name: Upload live eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibesense-evals-live-report
          path: |
            artifacts/live-evals/report-vector-off.json
            artifacts/live-evals/report-vector-off.md
            artifacts/live-evals/report-vector-on.json
            artifacts/live-evals/report-vector-on.md
            artifacts/live-evals/summary.md
